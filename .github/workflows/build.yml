name: CI

on:
  pull_request:
  push:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LIBEPHEMERIS_PRECISION: medium
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: |
          cd app
          uv venv .venv --python 3.12
          uv pip install -r requirements.txt
          uv run python -c 'from libephemeris.download import download_leb2_for_tier; paths = download_leb2_for_tier("medium", groups=["core", "asteroids"], show_progress=False); assert len(paths) == 2'
      - name: Run tests
        run: |
          cd app
          uv run python -m pytest tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build container image
        run: docker build -t astral-kerykeion:test .

 
 